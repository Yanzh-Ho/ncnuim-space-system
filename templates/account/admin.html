{% extends "base.html" %}
{% block content %}
<h1>帳號審核</h1>
<table>
	<tr><th>帳號</th><th>姓名</th><th>身分</th><th>狀態</th><th>操作</th></tr>
	{% for u in users %}
	<tr>
		<td>{{ u.id }}</td>
		<td>{{ u.name }}</td>
		<td>{{ {'admin':'管理員', 'teacher':'老師', 'student':'學生'}[u.role] }}</td>
		<td>{% if u.approved %}已通過{% else %}<b style="color:#c62828">待審核</b>{% endif %}</td>
		<td>
		{% if not u.approved %}
			<form style="display:inline" method="post" action="/account/admin/approve/{{ u.id }}">
				<button class="btn green">通過</button>
			</form>
			<form style="display:inline" method="post" action="/account/admin/reject/{{ u.id }}"
				onsubmit="return confirm('確定拒絕並刪除這個帳號？')">
				<button class="btn red">拒絕</button>
			</form>
		{% endif %}
		</td>
	</tr>
	{% endfor %}
</table>
{% endblock %}
