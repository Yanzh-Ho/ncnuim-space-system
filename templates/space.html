
<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>空間預約</title>
</head>
<body>

    <h1>空間預約系統</h1>

    <h2>可預約空間</h2>

    {% for space in spaces %}
        <div>
            <h3>{{ space.name }}</h3>

            <a href="/space/{{ space.id }}/calendar">
                查看週行事曆
            </a>

            <p>位置：{{ space.location }}</p>
            <p>容納人數：{{ space.capacity }} 人</p>
            <p>介紹：{{ space.description }}</p>

            <hr>
        </div>
    {% endfor %}

</body>
</html>
